<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAI Coin Mining</title>

<style>

body{
background:#050b1f;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.card{
background:#0c1a3a;
padding:20px;
margin:10px;
border-radius:15px;
}

button{
padding:15px 25px;
border:none;
border-radius:10px;
background:#00aaff;
color:white;
font-weight:bold;
}

</style>

</head>

<body>

<h1>RAI Coin</h1>

<div class="card">
Wallet
<h3 id="wallet"></h3>
</div>

<div class="card">
Balance
<h2 id="balance">0</h2>
</div>

<div class="card">
<button onclick="mine()">Start Mining</button>
</div>

<script>

let wallet = localStorage.getItem("wallet")

if(!wallet){

wallet = "rai"+Math.random().toString(36).substring(7)

localStorage.setItem("wallet",wallet)

}

document.getElementById("wallet").innerText = wallet

async function mine(){

await fetch("/mine/"+wallet)

update()

}

async function update(){

let res = await fetch("/balance/"+wallet)

let data = await res.json()

document.getElementById("balance").innerText = data.balance

}

setInterval(update,5000)

update()

</script>

</body>
</html>
