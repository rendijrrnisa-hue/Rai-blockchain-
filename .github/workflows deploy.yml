name: RAI Blockchain Mining

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Start Blockchain Server
      run: |
        node server.js &
        sleep 20

    - name: Test Mining
      run: |
        curl http://localhost:3000/mine/testwallet
        curl http://localhost:3000/balance/testwallet
