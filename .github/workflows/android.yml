name: Build RAI Android

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Cordova App
        run: |
          cordova create rai com.rai.blockchain RAI
          cd rai
          cordova platform add android
          cp -r ../index.html www/
          cp -r ../style.css www/ || true
          cp -r ../app.js www/ || true
          cp -r ../blockchain.js www/ || true

      - name: Build APK
        run: |
          cd rai
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rai-apk
          path: rai/platforms/android/app/build/outputs/apk/debug/app-debug.apk